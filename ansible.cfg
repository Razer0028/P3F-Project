[defaults]
inventory = ~/.config/edge-stack/ansible/hosts.ini
roles_path = ansible/roles
retry_files_enabled = False
# 中間者攻撃を防ぐため有効にする。
# 初回接続時は README の手順どおり ssh-keyscan で known_hosts に登録すること。
host_key_checking = True
vault_password_file = ~/.config/edge-stack/vault_pass
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
