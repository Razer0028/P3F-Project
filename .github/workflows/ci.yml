name: CI

# 構文・整形チェックのみを行う（デプロイや認証情報を必要とする操作は含めない）。
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  ansible:
    name: Ansible 構文チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: ansible-core と必要なコレクションを導入
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core
          ansible-galaxy collection install -r ansible/requirements.yml

      # リポジトリの ansible.cfg は vault_password_file を参照するため、
      # CI では最小構成の設定ファイルを使う。
      - name: CI 用の設定とダミーインベントリを作成
        run: |
          cat > /tmp/ci-ansible.cfg <<'EOF'
          [defaults]
          roles_path = ansible/roles
          retry_files_enabled = False
          interpreter_python = auto_silent
          EOF
          cat > /tmp/ci-inventory.ini <<'EOF'
          [onprem]
          onprem-1 ansible_host=192.0.2.10
          [vps]
          vps-1 ansible_host=192.0.2.20
          [ec2]
          ec2-1 ansible_host=192.0.2.30
          EOF

      - name: プレイブックの構文チェック
        env:
          ANSIBLE_CONFIG: /tmp/ci-ansible.cfg
        run: ansible-playbook --syntax-check -i /tmp/ci-inventory.ini ansible/site.yml

      # 既存の指摘が多いため、当面は失敗させず結果の確認のみ行う。
      - name: ansible-lint（参考情報・失敗させない）
        continue-on-error: true
        env:
          ANSIBLE_CONFIG: /tmp/ci-ansible.cfg
        run: |
          python -m pip install ansible-lint
          ansible-lint ansible/site.yml || true

  terraform:
    name: Terraform 検証
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform, terraform-cloudflare]
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: 整形チェック
        run: terraform -chdir=${{ matrix.dir }} fmt -check -recursive

      - name: init（バックエンドなし）
        run: terraform -chdir=${{ matrix.dir }} init -backend=false

      - name: validate
        run: terraform -chdir=${{ matrix.dir }} validate

  php:
    name: PHP 構文チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"

      - name: .php を lint
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            php -l -n "$f" || fail=1
          done < <(find . -name '*.php' -not -path './.git/*' -print0)
          exit $fail

      # .php.j2 は Jinja のまま lint できないため、プレースホルダを除去してから確認する。
      - name: .php.j2 を Jinja 除去後に lint
        run: |
          python3 - <<'EOF'
          import pathlib, re, subprocess, sys, tempfile
          fail = 0
          for p in pathlib.Path('.').rglob('*.php.j2'):
              src = p.read_text(encoding='utf-8')
              s = re.sub(r'\{%\s*(raw|endraw)\s*%\}', '', src)
              s = re.sub(r'\{%.*?%\}', '', s, flags=re.S)
              s = re.sub(r'\{\{.*?\}\}', 'JINJA', s, flags=re.S)
              with tempfile.NamedTemporaryFile('w', suffix='.php', delete=False,
                                               encoding='utf-8') as tmp:
                  tmp.write(s)
                  name = tmp.name
              r = subprocess.run(['php', '-l', '-n', name],
                                 capture_output=True, text=True)
              print(('OK   ' if r.returncode == 0 else 'FAIL ') + str(p))
              if r.returncode != 0:
                  print(r.stdout + r.stderr)
                  fail = 1
          sys.exit(fail)
          EOF

  scripts:
    name: Python / JS / シェル構文チェック
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Python を compile
        run: |
          find . -name '*.py' -not -path './.git/*' -print0 \
            | xargs -0 -n1 python -m py_compile

      - name: ポータルの JS を構文チェック
        run: node --check portal/app.js

      - name: シェルスクリプトを構文チェック
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" || fail=1
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $fail

      - name: shellcheck（参考情報・失敗させない）
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find . -name '*.sh' -not -path './.git/*' -print0 | xargs -0 shellcheck || true
