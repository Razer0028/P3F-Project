---
- name: コンテナスタックのセットアップ
  when: containers_manage | default(false)
  block:
    - name: コンテナ用グループを作成
      ansible.builtin.group:
        name: "{{ containers_group }}"
        state: present
      when:
        - containers_manage_user | default(true)
        - containers_group != "root"

    - name: コンテナ用ユーザーを作成
      ansible.builtin.user:
        name: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        state: present
        create_home: true
      when:
        - containers_manage_user | default(true)
        - containers_owner != "root"

    - name: コンテナ所有者の uid を取得
      ansible.builtin.command: id -u {{ containers_owner }}
      register: containers_owner_uid_cmd
      changed_when: false
      when: containers_owner != "root"

    - name: コンテナ所有者の gid を取得
      ansible.builtin.command: id -g {{ containers_owner }}
      register: containers_owner_gid_cmd
      changed_when: false
      when: containers_owner != "root"

    - name: コンテナ所有者の uid/gid をファクトに設定
      ansible.builtin.set_fact:
        containers_owner_uid: "{{ containers_owner_uid_cmd.stdout }}"
        containers_owner_gid: "{{ containers_owner_gid_cmd.stdout }}"
      when: containers_owner != "root"

    - name: root 用にコンテナ所有者の uid/gid を設定
      ansible.builtin.set_fact:
        containers_owner_uid: 0
        containers_owner_gid: 0
      when: containers_owner == "root"

    - name: コンテナ配置先ディレクトリを作成
      ansible.builtin.file:
        path: "{{ containers_root }}"
        state: directory
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0755"

    - name: docker compose コマンドを検出
      block:
        - name: 設定された compose コマンドを確認
          ansible.builtin.shell: "{{ containers_compose_cmd }} version"
          register: containers_compose_check
          changed_when: false
          failed_when: false

        - name: 旧 docker-compose コマンドを確認
          ansible.builtin.command: docker-compose --version
          register: containers_compose_legacy
          changed_when: false
          failed_when: false

        # docker-compose（v1, Python 版）は Debian 13 で削除されたため
        # `docker compose` を提供する v2 プラグインを入れる。
        - name: docker-compose が無い場合にインストール（任意）
          ansible.builtin.apt:
            name: docker-compose-v2
            state: present
            update_cache: "{{ containers_compose_update_cache | default(true) }}"
            cache_valid_time: "{{ (containers_compose_update_cache | default(true)) | ternary(containers_compose_cache_valid_time | default(0), omit) }}"
          register: containers_compose_install
          retries: 3
          delay: 10
          until: containers_compose_install is succeeded
          when:
            - containers_install_compose | default(true)
            - (containers_compose_check.rc | default(1)) != 0
            - (containers_compose_legacy.rc | default(1)) != 0

        - name: インストール後に compose コマンドを再確認
          when:
            - containers_install_compose | default(true)
            - (containers_compose_check.rc | default(1)) != 0
            - (containers_compose_legacy.rc | default(1)) != 0
          block:
            - name: 設定された compose コマンドを確認（インストール後）
              ansible.builtin.shell: "{{ containers_compose_cmd }} version"
              register: containers_compose_check
              changed_when: false
              failed_when: false

            - name: 旧 docker-compose コマンドを確認（インストール後）
              ansible.builtin.command: docker-compose --version
              register: containers_compose_legacy
              changed_when: false
              failed_when: false

        - name: 利用可能な compose コマンドを選択
          ansible.builtin.set_fact:
            containers_compose_cmd: >-
              {{ 'docker-compose'
                 if (containers_compose_check.rc | default(1)) != 0 and (containers_compose_legacy.rc | default(1)) == 0
                 else containers_compose_cmd }}

        - name: 選択した compose コマンドを検証
          ansible.builtin.shell: "{{ containers_compose_cmd }} version"
          register: containers_compose_final_check
          changed_when: false
          failed_when: false

        - name: 選択したコマンドが失敗した場合は旧 compose にフォールバック
          when: (containers_compose_final_check.rc | default(1)) != 0
          block:
            - name: 旧 docker-compose コマンドを確認（フォールバック）
              ansible.builtin.command: docker-compose --version
              register: containers_compose_legacy_final
              changed_when: false
              failed_when: false

            - name: 利用可能な場合は旧 docker-compose を使用
              ansible.builtin.set_fact:
                containers_compose_cmd: "docker-compose"
              when: (containers_compose_legacy_final.rc | default(1)) == 0

            - name: 利用可能な compose コマンドが無い場合は失敗させる
              ansible.builtin.fail:
                msg: "docker compose も docker-compose も利用できません"
              when: (containers_compose_legacy_final.rc | default(1)) != 0

    - name: /opt/serveradmin 配下のディレクトリ構成を作成
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - /opt/serveradmin
        - /opt/serveradmin/bin
        - /opt/serveradmin/scripts
        - /opt/serveradmin/logs
        - /opt/serveradmin/status
        - /opt/serveradmin/config

    - name: アーカイブ用ディレクトリを作成
      ansible.builtin.file:
        path: /opt/serveradmin/archives
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: ゲームアーカイブをコピー
      ansible.builtin.copy:
        src: "archives/{{ item }}"
        dest: "/opt/serveradmin/archives/{{ item }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - minecraft.tar.gz
        - valheim.tar.gz
        - 7dtd.tar.gz

    - name: ミラー用アーカイブディレクトリを作成
      ansible.builtin.file:
        path: "{{ containers_root }}/monitor/opt_serveradmin/archives"
        state: directory
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0755"

    - name: ゲームアーカイブをコピー（ミラー）
      ansible.builtin.copy:
        src: "archives/{{ item }}"
        dest: "{{ containers_root }}/monitor/opt_serveradmin/archives/{{ item }}"
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0644"
      loop:
        - minecraft.tar.gz
        - valheim.tar.gz
        - 7dtd.tar.gz

    - name: SteamCMD 資材を準備
      when: "'valheim' in containers_enabled or '7dtd' in containers_enabled"
      block:
        - name: SteamCMD 用ディレクトリを作成
          ansible.builtin.file:
            path: "{{ steamcmd_dir }}"
            state: directory
            owner: "{{ steamcmd_owner }}"
            group: "{{ steamcmd_group }}"
            mode: "0755"

        - name: SteamCMD のインストール状況を確認
          ansible.builtin.stat:
            path: "{{ steamcmd_dir }}/steamcmd.sh"
          register: steamcmd_stat

        - name: SteamCMD の tarball を確認
          ansible.builtin.stat:
            path: "{{ steamcmd_tarball }}"
          register: steamcmd_tarball_stat

        - name: SteamCMD をダウンロード
          ansible.builtin.get_url:
            url: "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz"
            dest: "{{ steamcmd_tarball }}"
            mode: "0644"
          register: steamcmd_download
          when:
            - not steamcmd_stat.stat.exists
            - not steamcmd_tarball_stat.stat.exists

        - name: SteamCMD tarball の存在フラグを設定
          ansible.builtin.set_fact:
            steamcmd_tarball_exists: "{{ steamcmd_tarball_stat.stat.exists or (steamcmd_download is defined and steamcmd_download is succeeded) }}"

        - name: SteamCMD tarball が無い場合は失敗させる
          ansible.builtin.fail:
            msg: "SteamCMD の tarball が {{ steamcmd_tarball }} に見つかりません。配置するか、ダウンロード用に外向き DNS を有効にしてください。"
          when:
            - not steamcmd_stat.stat.exists
            - not steamcmd_tarball_exists

        - name: SteamCMD を展開
          ansible.builtin.unarchive:
            src: "{{ steamcmd_tarball }}"
            dest: "{{ steamcmd_dir }}"
            remote_src: true
            owner: "{{ steamcmd_owner }}"
            group: "{{ steamcmd_group }}"
          when:
            - not steamcmd_stat.stat.exists
            - steamcmd_tarball_exists

        - name: SteamCMD のバイナリに実行権限を付与
          ansible.builtin.file:
            path: "{{ item }}"
            owner: "{{ steamcmd_owner }}"
            group: "{{ steamcmd_group }}"
            mode: "0755"
          loop:
            - "{{ steamcmd_dir }}/steamcmd.sh"
            - "{{ steamcmd_dir }}/linux32/steamcmd"
          when: steamcmd_tarball_exists

    - name: モニター用 serveradmin ディレクトリ構成を作成
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0755"
      loop:
        - "{{ containers_root }}/monitor/opt_serveradmin"
        - "{{ containers_root }}/monitor/opt_serveradmin/bin"
        - "{{ containers_root }}/monitor/opt_serveradmin/scripts"
        - "{{ containers_root }}/monitor/opt_serveradmin/logs"
        - "{{ containers_root }}/monitor/opt_serveradmin/status"
        - "{{ containers_root }}/monitor/opt_serveradmin/config"

    - name: serveradmin 補助スクリプトを配置
      ansible.builtin.template:
        src: "serveradmin/bin/{{ item }}.j2"
        dest: "/opt/serveradmin/bin/{{ item }}"
        owner: root
        group: root
        mode: "0750"
      loop:
        - docker_manage.sh
        - game_admin.sh

    - name: serveradmin 監視スクリプトを配置
      ansible.builtin.copy:
        src: "serveradmin/scripts/{{ item }}"
        dest: "/opt/serveradmin/scripts/{{ item }}"
        owner: root
        group: root
        mode: "0755"
      loop:
        - player_monitor.py

    - name: モニターマウント用に補助スクリプトをミラー
      ansible.builtin.template:
        src: "serveradmin/bin/{{ item }}.j2"
        dest: "{{ containers_root }}/monitor/opt_serveradmin/bin/{{ item }}"
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0750"
      loop:
        - docker_manage.sh
        - game_admin.sh

    - name: モニターマウント用に監視スクリプトをミラー
      ansible.builtin.copy:
        src: "serveradmin/scripts/{{ item }}"
        dest: "{{ containers_root }}/monitor/opt_serveradmin/scripts/{{ item }}"
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0755"
      loop:
        - player_monitor.py

    - name: ステータス JSON を用意
      ansible.builtin.copy:
        dest: "{{ item }}"
        content: "{}\n"
        owner: "{{ containers_owner }}"
        group: "{{ containers_group }}"
        mode: "0644"
        force: false
      loop:
        - /opt/serveradmin/status/current_players.json
        - "{{ containers_root }}/monitor/opt_serveradmin/status/current_players.json"

    - name: ポータルサービス設定を書き出し（ホスト）
      ansible.builtin.template:
        src: portal_services.json.j2
        dest: /opt/serveradmin/config/portal_services.json
        owner: root
        group: root
        mode: "0644"

    - name: ポータルサービス設定を書き出し（モニターマウント）
      ansible.builtin.template:
        src: portal_services.json.j2
        dest: "{{ containers_root }}/monitor/opt_serveradmin/config/portal_services.json"
        owner: "{{ containers_owner }}"
        group: "www-data"
        mode: "0664"

    - name: minecraft コンテナ用ファイルを配置
      when: "'minecraft' in containers_enabled"
      block:
        - name: minecraft 用ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/minecraft"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: minecraft のデータディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/minecraft/data"
            state: directory
            owner: "{{ containers_owner }}"
            group: "www-data"
            mode: "0775"
        - name: minecraft のビルドコンテキストを展開
          ansible.builtin.unarchive:
            src: "archives/minecraft.tar.gz"
            dest: "{{ containers_root }}/minecraft"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"

        - name: minecraft の起動スクリプトに実行権限を付与
          ansible.builtin.file:
            path: "{{ containers_root }}/minecraft/start.sh"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: minecraft の whitelist を Web ポータルから書き込み可能にする
          ansible.builtin.copy:
            dest: "{{ containers_root }}/minecraft/data/whitelist.json"
            content: "[]\n"
            owner: "{{ containers_owner }}"
            group: "www-data"
            mode: "0664"
            force: false

    - name: valheim コンテナ用ファイルを配置
      when: "'valheim' in containers_enabled"
      block:
        - name: valheim 用ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/valheim_server"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: valheim のデータディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/valheim_server/data"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: valheim のビルドコンテキストを展開
          ansible.builtin.unarchive:
            src: "archives/valheim.tar.gz"
            dest: "{{ containers_root }}/valheim_server"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"

        - name: valheim のデータボリュームパスを正規化
          ansible.builtin.replace:
            path: "{{ containers_root }}/valheim_server/docker-compose.yml"
            regexp: "/home/gameadmin/valheim_server/data"
            replace: "./data"

        - name: valheim の steamcmd ボリュームパスを正規化
          ansible.builtin.replace:
            path: "{{ containers_root }}/valheim_server/docker-compose.yml"
            regexp: "/home/gameadmin/steamcmd"
            replace: "{{ steamcmd_dir }}"

        - name: valheim の起動スクリプトに実行権限を付与
          ansible.builtin.file:
            path: "{{ containers_root }}/valheim_server/run_valheim.sh"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"

    - name: 7dtd コンテナ用ファイルを配置
      when: "'7dtd' in containers_enabled"
      block:
        - name: 7dtd 用ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/7dtd_server"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: 7dtd のデータディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/7dtd_server/{{ item }}"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
          loop:
            - serverfiles
            - data
            - logs
        - name: 7dtd のビルドコンテキストを展開
          ansible.builtin.unarchive:
            src: "archives/7dtd.tar.gz"
            dest: "{{ containers_root }}/7dtd_server"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"

        - name: 7dtd の steamcmd ボリュームパスを正規化
          ansible.builtin.replace:
            path: "{{ containers_root }}/7dtd_server/docker-compose.yml"
            regexp: "/home/gameadmin/steamcmd"
            replace: "{{ steamcmd_dir }}"

        - name: 7dtd の check_mapcount が成功を返すようにする
          ansible.builtin.lineinfile:
            path: "{{ containers_root }}/7dtd_server/start_7dtd.sh"
            line: "  return 0"
            insertbefore: "^}$"
            firstmatch: true

        - name: 7dtd の起動スクリプトに実行権限を付与
          ansible.builtin.file:
            path: "{{ containers_root }}/7dtd_server/start_7dtd.sh"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"

    - name: Web ポータル用ファイルを配置
      when: "'web_portal' in containers_enabled"
      block:
        - name: Web ポータル用ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/web"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: Web ポータルの主要ファイルをコピー
          ansible.builtin.copy:
            src: "web_portal/{{ item }}"
            dest: "{{ containers_root }}/web/{{ item }}"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
          loop:
            - Dockerfile
            - sudoers_www
        - name: Web ポータルの docker-compose を生成
          ansible.builtin.template:
            src: web_portal/docker-compose.yml.j2
            dest: "{{ containers_root }}/web/docker-compose.yml"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
        - name: Web ポータルのディレクトリをコピー
          ansible.builtin.copy:
            src: "web_portal/{{ item }}/"
            dest: "{{ containers_root }}/web/{{ item }}/"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
          loop:
            - admin
            - public

        - name: Web ポータルの入れ子ディレクトリを削除
          ansible.builtin.file:
            path: "{{ containers_root }}/web/{{ item }}/{{ item }}"
            state: absent
          loop:
            - admin
            - public

        - name: Web ポータルの scripts ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/web/public/scripts"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"

        - name: Web ポータルの portal_config.php を生成
          ansible.builtin.template:
            src: web_portal/public/scripts/portal_config.php.j2
            dest: "{{ containers_root }}/web/public/scripts/portal_config.php"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
        - name: Web ポータルの server_portal.php を生成
          ansible.builtin.template:
            src: web_portal/public/scripts/server_portal.php.j2
            dest: "{{ containers_root }}/web/public/scripts/server_portal.php"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
        - name: Web ポータルの docker_panel.php を生成
          ansible.builtin.template:
            src: web_portal/admin/docker_panel.php.j2
            dest: "{{ containers_root }}/web/admin/docker_panel.php"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"

        - name: Web ポータルの apache ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/web/apache"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"

        - name: Web ポータルの apache vhost を生成
          ansible.builtin.template:
            src: 000-default.conf.j2
            dest: "{{ containers_root }}/web/apache/000-default.conf"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"

        - name: Web ポータルの管理者資格情報を検証
          ansible.builtin.assert:
            that:
              - web_portal_admin_user | length > 0
              - web_portal_admin_password | length > 0
            fail_msg: "web_portal_admin_enable を有効にする場合は web_portal_admin_user と web_portal_admin_password が必要です"
          when: web_portal_admin_enable | default(false)
          no_log: true

        - name: Web ポータルの管理者ダイジェストを計算
          ansible.builtin.set_fact:
            web_portal_admin_htdigest_line: "{{ web_portal_admin_user }}:{{ web_portal_admin_realm | default(\"admin-panel\") }}:{{ (web_portal_admin_user ~ \":\" ~ (web_portal_admin_realm | default(\"admin-panel\")) ~ \":\" ~ web_portal_admin_password) | hash(\"md5\") }}"
          when: web_portal_admin_enable | default(false)
          no_log: true

        - name: Web ポータルの管理者ダイジェストを書き出し（自動生成）
          ansible.builtin.copy:
            dest: "{{ containers_root }}/web/admin/.htdigest"
            content: "{{ web_portal_admin_htdigest_line }}\n"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
          when: web_portal_admin_enable | default(false)
          no_log: true

        - name: Web ポータルの管理者ダイジェストを書き出し（手動指定）
          ansible.builtin.copy:
            dest: "{{ containers_root }}/web/admin/.htdigest"
            content: "{{ web_portal_admin_htdigest | trim }}\n"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"
          when:
            - not (web_portal_admin_enable | default(false))
            - web_portal_admin_htdigest | default("") | length > 0
          no_log: true

        - name: 未設定の場合は Web ポータルの管理者ダイジェストを削除
          ansible.builtin.file:
            path: "{{ containers_root }}/web/admin/.htdigest"
            state: absent
          when:
            - not (web_portal_admin_enable | default(false))
            - web_portal_admin_htdigest | default("") | length == 0

        - name: Web ポータルの .env を書き出し（任意）
          ansible.builtin.copy:
            dest: "{{ containers_root }}/web/.env"
            content: "DISCORD_WEBHOOK_URL={{ web_portal_discord_webhook }}\n"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0600"
          when: web_portal_discord_webhook | default('') | length > 0
          no_log: true

    - name: プレイヤーモニター用ファイルを配置
      when: "'player_monitor' in containers_enabled"
      block:
        - name: モニター用ディレクトリを作成
          ansible.builtin.file:
            path: "{{ containers_root }}/monitor"
            state: directory
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0755"
        - name: モニター用ファイルをコピー
          ansible.builtin.copy:
            src: "monitor/{{ item }}"
            dest: "{{ containers_root }}/monitor/{{ item }}"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "{{ '0755' if item == 'start.sh' else '0644' }}"
          loop:
            - Dockerfile
            - player_monitor.logrotate
            - start.sh
        - name: モニターの docker-compose を生成
          ansible.builtin.template:
            src: monitor/docker-compose.yml.j2
            dest: "{{ containers_root }}/monitor/docker-compose.yml"
            owner: "{{ containers_owner }}"
            group: "{{ containers_group }}"
            mode: "0644"

    - name: minecraft コンテナを起動
      when:
        - containers_start | default(false)
        - "'minecraft' in containers_enabled"
      ansible.builtin.command: "{{ containers_compose_cmd | default('docker compose') }} up -d --build"
      args:
        chdir: "{{ containers_root }}/minecraft"

    - name: valheim コンテナを起動
      when:
        - containers_start | default(false)
        - "'valheim' in containers_enabled"
      ansible.builtin.command: "{{ containers_compose_cmd | default('docker compose') }} up -d --build"
      args:
        chdir: "{{ containers_root }}/valheim_server"

    - name: 7dtd コンテナを起動
      when:
        - containers_start | default(false)
        - "'7dtd' in containers_enabled"
      ansible.builtin.command: "{{ containers_compose_cmd | default('docker compose') }} up -d --build"
      args:
        chdir: "{{ containers_root }}/7dtd_server"

    - name: Web ポータルコンテナを起動
      when:
        - containers_start | default(false)
        - "'web_portal' in containers_enabled"
      ansible.builtin.command: "{{ containers_compose_cmd | default('docker compose') }} up -d --build"
      args:
        chdir: "{{ containers_root }}/web"

    - name: プレイヤーモニターコンテナを起動
      when:
        - containers_start | default(false)
        - "'player_monitor' in containers_enabled"
      ansible.builtin.command: "{{ containers_compose_cmd | default('docker compose') }} up -d --build"
      args:
        chdir: "{{ containers_root }}/monitor"
