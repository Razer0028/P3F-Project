---
- name: Docker 設定
  when: docker_manage | default(false)
  block:
    # command は shell の組み込みコマンドなので ansible.builtin.command では実行できず、
    # 常に rc != 0（= docker 未導入扱い）になっていた。shell モジュールで判定する。
    - name: docker バイナリの有無を確認
      ansible.builtin.shell: command -v docker
      register: docker_binary
      changed_when: false
      failed_when: false

    - name: docker パッケージの提供状況を確認
      ansible.builtin.command: apt-cache show {{ item }}
      register: docker_pkg_checks
      changed_when: false
      failed_when: false
      loop: "{{ docker_packages }}"
      when: (docker_install_if_missing | default(true) | bool) and docker_binary.rc != 0

    - name: 導入する docker パッケージを選択
      ansible.builtin.set_fact:
        docker_packages_to_install: "{{ docker_pkg_checks.results | selectattr('rc', 'equalto', 0) | map(attribute='item') | list }}"
      when: (docker_install_if_missing | default(true) | bool) and docker_binary.rc != 0

    - name: 利用可能な docker パッケージが無い場合は中断
      ansible.builtin.fail:
        msg: "apt キャッシュに docker パッケージが見つかりません。apt のリポジトリ設定を確認するか、docker_packages を指定してください。"
      when:
        - (docker_install_if_missing | default(true) | bool)
        - docker_binary.rc != 0
        - docker_packages_to_install | default([]) | length == 0

    - name: docker が無い場合にパッケージを導入
      ansible.builtin.apt:
        name: "{{ docker_packages_to_install | default(docker_packages) }}"
        state: present
        update_cache: "{{ docker_update_cache | default(true) }}"
        cache_valid_time: "{{ (docker_update_cache | default(true)) | ternary(docker_cache_valid_time | default(0), omit) }}"
      register: docker_install
      retries: 3
      delay: 10
      until: docker_install is succeeded
      when:
        - (docker_install_if_missing | default(true) | bool)
        - docker_binary.rc != 0
        - docker_packages_to_install | default(docker_packages) | length > 0

    - name: docker グループを作成
      ansible.builtin.group:
        name: docker
        state: present

    - name: ユーザーを docker グループに追加
      ansible.builtin.user:
        name: "{{ item }}"
        groups: docker
        append: true
      loop: "{{ docker_users }}"
      when: docker_users | length > 0

    - name: docker 設定ディレクトリを作成
      ansible.builtin.file:
        path: /etc/docker
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: docker_manage_daemon_config | default(false)

    - name: daemon.json を書き出し
      ansible.builtin.template:
        src: daemon.json.j2
        dest: "{{ docker_daemon_config_path }}"
        owner: root
        group: root
        mode: "0644"
      when: docker_manage_daemon_config | default(false)
      notify: Restart docker

    - name: docker サービスの状態を設定
      ansible.builtin.systemd_service:
        name: "{{ docker_service_name }}"
        enabled: "{{ docker_manage_service | default(true) }}"
        state: "{{ docker_manage_service | default(true) | ternary('started', 'stopped') }}"
      when: docker_manage_service | default(true)
