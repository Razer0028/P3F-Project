---
- name: FRR の設定
  when: frr_manage | default(false)
  block:
    - name: FRR バイナリを確認
      ansible.builtin.command: "{{ frr_binary_path }} --version"
      register: frr_binary
      changed_when: false
      failed_when: false

    - name: FRR パッケージが存在しない場合に導入
      ansible.builtin.apt:
        name: "{{ frr_packages }}"
        state: present
        update_cache: "{{ frr_update_cache | default(true) }}"
        cache_valid_time: "{{ (frr_update_cache | default(true)) | ternary(frr_cache_valid_time | default(0), omit) }}"
      register: frr_install
      retries: 3
      delay: 10
      until: frr_install is succeeded
      when: frr_install_if_missing | default(true) and frr_binary.rc != 0

    - name: /etc/frr の存在を確認
      ansible.builtin.file:
        path: /etc/frr
        state: directory
        owner: "{{ frr_owner_default }}"
        group: "{{ frr_group_default }}"
        mode: "0750"

    - name: 既存の frr.conf のメタデータを取得
      ansible.builtin.stat:
        path: "{{ frr_conf_path }}"
      register: frr_conf_stat

    - name: 既存の daemons のメタデータを取得
      ansible.builtin.stat:
        path: "{{ frr_daemons_path }}"
      register: frr_daemons_stat

    - name: FRR の設定内容を生成
      ansible.builtin.set_fact:
        frr_config_final: >-
          {{ lookup('template', 'frr.conf.j2')
             if (frr_generate_config | default(false))
             else (frr_config_content | default('')) }}
        frr_daemons_final: >-
          {{ lookup('template', 'daemons.j2')
             if (frr_generate_config | default(false))
             else (frr_daemons_content | default('')) }}

    - name: FRR サービスの準備状況を判定
      ansible.builtin.set_fact:
        frr_config_ready: "{{ (frr_config_final | length > 0) or (frr_conf_stat.stat.exists | default(false)) }}"
        frr_daemons_ready: "{{ (frr_daemons_final | length > 0) or (frr_daemons_stat.stat.exists | default(false)) }}"

    - name: FRR の準備状況をまとめる
      ansible.builtin.set_fact:
        frr_service_ready: "{{ (frr_config_ready | default(false)) and (frr_daemons_ready | default(false)) }}"

    - name: 設定不足により FRR サービスをスキップする場合に警告
      ansible.builtin.debug:
        msg: "FRR サービスをスキップします: frr.conf/daemons が未準備です (frr_generate_config または frr_config_content/daemons を設定してください)。"
      when: (frr_manage_service | default(false)) and not (frr_service_ready | default(false))

    - name: frr.conf の所有者/グループを決定
      ansible.builtin.set_fact:
        frr_conf_owner: "{{ frr_conf_stat.stat.pw_name | default(frr_owner_default) }}"
        frr_conf_group: "{{ frr_conf_stat.stat.gr_name | default(frr_group_default) }}"

    - name: daemons の所有者/グループを決定
      ansible.builtin.set_fact:
        frr_daemons_owner: "{{ frr_daemons_stat.stat.pw_name | default(frr_daemons_owner_default) }}"
        frr_daemons_group: "{{ frr_daemons_stat.stat.gr_name | default(frr_daemons_group_default) }}"

    - name: frr.conf が存在し上書きが無効な場合に警告
      ansible.builtin.debug:
        msg: "{{ frr_conf_path }} が既に存在します。置き換えるには frr_allow_overwrite: true を指定してください"
      when: frr_conf_stat.stat.exists and not (frr_allow_overwrite | default(false))

    - name: daemons が存在し上書きが無効な場合に警告
      ansible.builtin.debug:
        msg: "{{ frr_daemons_path }} が既に存在します。置き換えるには frr_allow_overwrite: true を指定してください"
      when: frr_daemons_stat.stat.exists and not (frr_allow_overwrite | default(false))

    - name: FRR の設定変数を検証
      ansible.builtin.assert:
        that:
          - frr_config_final | length > 0
          - frr_daemons_final | length > 0
        fail_msg: "frr_config_content/daemons または frr_generate_config を設定してください"
      when: frr_require_vars | default(false)

    - name: frr.conf を配置
      ansible.builtin.copy:
        dest: "{{ frr_conf_path }}"
        content: "{{ frr_config_final }}"
        owner: "{{ frr_conf_owner }}"
        group: "{{ frr_conf_group }}"
        mode: "0640"
        force: "{{ frr_allow_overwrite | default(false) }}"
        backup: "{{ frr_allow_overwrite | default(false) }}"
      when: frr_config_final | length > 0
      notify: Restart frr

    - name: daemons を配置
      ansible.builtin.copy:
        dest: "{{ frr_daemons_path }}"
        content: "{{ frr_daemons_final }}"
        owner: "{{ frr_daemons_owner }}"
        group: "{{ frr_daemons_group }}"
        mode: "0640"
        force: "{{ frr_allow_overwrite | default(false) }}"
        backup: "{{ frr_allow_overwrite | default(false) }}"
      when: frr_daemons_final | length > 0
      notify: Restart frr

    - name: FRR サービスの状態を適用
      ansible.builtin.systemd_service:
        name: "{{ frr_service_name }}"
        enabled: "{{ frr_enable_service | default(true) }}"
        state: "{{ frr_service_state }}"
      when: (frr_manage_service | default(false)) and (frr_service_ready | default(false))
