---
- name: WireGuard の設定
  when: wireguard_manage | default(false)
  block:
    - name: WireGuard パッケージを導入
      ansible.builtin.apt:
        name:
          - wireguard
          - wireguard-tools
          - resolvconf
        state: present
        update_cache: "{{ wireguard_update_cache | default(true) }}"
        cache_valid_time: "{{ (wireguard_update_cache | default(true)) | ternary(3600, omit) }}"

    - name: /etc/wireguard の存在を確認
      ansible.builtin.file:
        path: /etc/wireguard
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: WireGuard の設定一覧を選択
      ansible.builtin.set_fact:
        wireguard_items: "{{ wireguard_raw_configs | default(wireguard_configs | default([])) }}"
        wireguard_item_names: "{{ (wireguard_raw_configs | default(wireguard_configs | default([]))) | map(attribute='name') | list }}"

    - name: WireGuard の NAT が有効かどうかを確認
      ansible.builtin.set_fact:
        wireguard_nat_enabled: >-
          {{
            (wireguard_items | default([])
              | selectattr('enable_nat', 'defined')
              | selectattr('enable_nat')
              | list
              | length) > 0
          }}

    - name: WireGuard の NAT インターフェースを検出
      ansible.builtin.set_fact:
        wireguard_nat_interface: "{{ ansible_default_ipv4.interface }}"
      when: wireguard_nat_interface | default("") | length == 0

    - name: WireGuard の NAT が有効な場合に ufw を導入 (任意)
      ansible.builtin.apt:
        name: ufw
        state: present
        update_cache: "{{ wireguard_update_cache | default(true) }}"
        cache_valid_time: "{{ (wireguard_update_cache | default(true)) | ternary(3600, omit) }}"
      when:
        - wireguard_ufw_manage | default(true)
        - wireguard_nat_enabled | default(false)

    - name: ufw の状態を確認 (任意)
      ansible.builtin.command: ufw status
      register: wireguard_ufw_status
      changed_when: false
      failed_when: false
      when:
        - wireguard_ufw_manage | default(true)
        - wireguard_nat_enabled | default(false)

    - name: ufw を有効化する前に SSH を許可 (任意)
      ansible.builtin.command: ufw allow 22/tcp
      register: wireguard_ufw_allow_ssh
      changed_when: false
      failed_when: false
      when:
        - wireguard_ufw_manage | default(true)
        - wireguard_nat_enabled | default(false)

    - name: ufw で WireGuard のポートを許可 (任意)
      ansible.builtin.command: ufw allow 51820/udp
      register: wireguard_ufw_allow
      changed_when: false
      failed_when: false
      when:
        - wireguard_ufw_manage | default(true)
        - wireguard_nat_enabled | default(false)

    - name: 既存の WireGuard 設定を確認
      ansible.builtin.stat:
        path: "/etc/wireguard/{{ item }}.conf"
      register: wg_conf_stats
      loop: "{{ wireguard_item_names }}"

    - name: 上書きが無効な場合に既存設定について警告
      ansible.builtin.debug:
        msg: "/etc/wireguard/{{ item.item }}.conf が既に存在します。置き換えるには wireguard_allow_overwrite: true を指定してください"
      when: item.stat.exists and not (wireguard_allow_overwrite | default(false))
      loop: "{{ wg_conf_stats.results }}"

    - name: 上書き前に既存の WireGuard 設定をバックアップ
      ansible.builtin.copy:
        src: "/etc/wireguard/{{ item.item }}.conf"
        dest: "/etc/wireguard/{{ item.item }}.conf.{{ ansible_date_time.iso8601_basic_short }}"
        remote_src: true
        owner: root
        group: root
        mode: "0600"
      when: item.stat.exists and (wireguard_allow_overwrite | default(false))
      loop: "{{ wg_conf_stats.results }}"

    - name: WireGuard 設定を配置 (raw)
      ansible.builtin.copy:
        dest: "/etc/wireguard/{{ item.name }}.conf"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0600"
        force: "{{ wireguard_allow_overwrite | default(false) }}"
        backup: false
      loop: "{{ wireguard_raw_configs | default([]) }}"
      when: wireguard_raw_configs is defined
      no_log: true

    - name: WireGuard 設定を配置 (テンプレート)
      ansible.builtin.template:
        src: wg.conf.j2
        dest: "/etc/wireguard/{{ item.name }}.conf"
        owner: root
        group: root
        mode: "0600"
        force: "{{ wireguard_allow_overwrite | default(false) }}"
        backup: false
      loop: "{{ wireguard_configs | default([]) }}"
      when: wireguard_raw_configs is not defined
      no_log: true

    - name: wg-quick のオーバーライドディレクトリを作成
      ansible.builtin.file:
        path: "/etc/systemd/system/wg-quick@{{ item }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ wireguard_item_names }}"

    - name: wg-quick の Conflicts オーバーライドを追加
      ansible.builtin.copy:
        dest: "/etc/systemd/system/wg-quick@{{ item }}.service.d/override.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Unit]
          Conflicts=wg-quick@wg0.service wg-quick@wg1.service
          After=network-online.target
      loop: "{{ wireguard_item_names }}"

    - name: systemd デーモンをリロード
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: プライマリ以外の WireGuard サービスを無効化
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ item }}"
        enabled: false
        state: stopped
      loop: "{{ wireguard_item_names | difference([wireguard_primary]) }}"
      when: wireguard_primary is defined and wireguard_primary in wireguard_item_names

    - name: プライマリの WireGuard サービスを起動時に有効化
      ansible.builtin.systemd_service:
        name: "wg-quick@{{ wireguard_primary }}"
        enabled: true
        state: started
      when: wireguard_enable_on_boot | default(false) and wireguard_primary is defined

    - name: ufw の状態を確認 (任意)
      ansible.builtin.command: ufw status
      register: wireguard_ufw_status
      changed_when: false
      failed_when: false

    - name: ufw で WireGuard の転送を許可 (任意)
      ansible.builtin.command: ufw route allow in on {{ item.name }} out on {{ wireguard_nat_interface }}
      register: wireguard_ufw_route
      changed_when: false
      failed_when: false
      loop: "{{ wireguard_items }}"
      when:
        - wireguard_ufw_status.rc == 0

    - name: 転送ルールが指定された場合に補助スクリプトを配置
      ansible.builtin.copy:
        dest: /usr/local/sbin/edge-stack-forwarding.py
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/usr/bin/env python3
          import json
          import os
          import re
          import shutil
          import subprocess

          rules = json.loads(os.environ.get("EDGE_FORWARD_RULES", "[]") or "[]")
          ufw_rules = json.loads(os.environ.get("EDGE_UFW_RULES", "[]") or "[]")
          nat_if = os.environ.get("EDGE_NAT_IF", "")

          def run(cmd):
              subprocess.run(cmd, shell=True, check=False, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)

          if shutil.which("ufw"):
              for rule in ufw_rules:
                  rule = str(rule).strip()
                  if rule:
                      run(f"ufw {rule}")

              for rule in rules:
                  proto = str(rule.get("protocol", "")).lower()
                  protos = ["tcp", "udp"] if proto == "both" else [proto]
                  dest_ip = str(rule.get("dest_ip", "")).strip()
                  dest_port = str(rule.get("dest_port", "")).strip()
                  if not dest_ip or not dest_port:
                      continue
                  for p in protos:
                      if p in ("tcp", "udp"):
                          run(f"ufw route allow proto {p} from any to {dest_ip} port {dest_port}")

          if not rules or not nat_if:
              raise SystemExit(0)

          before_rules = "/etc/ufw/before.rules"
          try:
              content = open(before_rules, "r", encoding="utf-8").read()
          except Exception:
              raise SystemExit(0)

          dnat_lines = []
          for rule in rules:
              proto = str(rule.get("protocol", "")).lower()
              protos = ["tcp", "udp"] if proto == "both" else [proto]
              dest_ip = str(rule.get("dest_ip", "")).strip()
              ext_port = str(rule.get("ext_port", "")).strip()
              dest_port = str(rule.get("dest_port", "")).strip() or ext_port
              if not dest_ip or not ext_port or not dest_port:
                  continue
              ext_ipt = ext_port.replace("-", ":")
              dest_ipt = dest_port.replace("-", ":")
              for p in protos:
                  if p not in ("tcp", "udp"):
                      continue
                  dnat_lines.append(
                      f"-A PREROUTING -i {nat_if} -p {p} --dport {ext_ipt} -j DNAT --to-destination {dest_ip}:{dest_ipt}"
                  )

          marker_start = "# EDGE-STACK NAT BEGIN"
          marker_end = "# EDGE-STACK NAT END"
          block = "\n".join([marker_start] + dnat_lines + [marker_end]) + "\n"

          if "*nat" not in content:
              nat_block = "*nat\n:PREROUTING ACCEPT [0:0]\n:POSTROUTING ACCEPT [0:0]\n"
              nat_block += block + "COMMIT\n\n"
              content = nat_block + content
          else:
              block_re = re.compile(re.escape(marker_start) + r".*?" + re.escape(marker_end) + r"\n?", re.S)
              if block_re.search(content):
                  content = block_re.sub(block, content)
              else:
                  nat_start = content.find("*nat")
                  nat_commit = content.find("COMMIT", nat_start)
                  if nat_commit != -1:
                      content = content[:nat_commit] + block + content[nat_commit:]

          with open(before_rules, "w", encoding="utf-8") as fh:
              fh.write(content)

          run("ufw reload")
      when:
        - wireguard_ufw_manage | default(true)
        - (wireguard_ufw_rules | default([]) | length > 0) or (wireguard_forward_rules | default([]) | length > 0)

    - name: 補助スクリプトで転送ルールを適用 (任意)
      ansible.builtin.command: /usr/local/sbin/edge-stack-forwarding.py
      environment:
        EDGE_NAT_IF: "{{ wireguard_nat_interface | default('') }}"
        EDGE_FORWARD_RULES: "{{ wireguard_forward_rules | default([]) | to_json }}"
        EDGE_UFW_RULES: "{{ wireguard_ufw_rules | default([]) | to_json }}"
      changed_when: false
      failed_when: false
      when:
        - wireguard_ufw_manage | default(true)
        - (wireguard_ufw_rules | default([]) | length > 0) or (wireguard_forward_rules | default([]) | length > 0)

    - name: ルール適用後に ufw の状態を確認 (任意)
      ansible.builtin.command: ufw status
      register: wireguard_ufw_status_post
      changed_when: false
      failed_when: false
      when:
        - wireguard_ufw_manage | default(true)
        - wireguard_nat_enabled | default(false)

    - name: ufw が無効な場合に有効化 (ルール適用後)
      ansible.builtin.command: ufw --force enable
      when:
        - wireguard_ufw_manage | default(true)
        - wireguard_nat_enabled | default(false)
        - wireguard_ufw_status_post.stdout is defined
        - "'inactive' in wireguard_ufw_status_post.stdout.lower()"
      changed_when: true
      failed_when: false
