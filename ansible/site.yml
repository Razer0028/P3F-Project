---
- name: "基本設定"
  hosts: all
  become: true
  gather_facts: false
  pre_tasks:
    - name: VPS の SSH 接続が安定するまで待機
      ansible.builtin.wait_for_connection:
        timeout: 60
        connect_timeout: 5
        sleep: 2
      when: "'vps' in group_names"

    - name: ファクトを収集
      ansible.builtin.setup:
  roles:
    - role: base
      tags:
        - base

- name: "オンプレミス サービス"
  hosts: onprem
  become: true
  roles:
    - wireguard
    - role: frr
      tags:
        - frr
    - docker
    - containers
    - role: failover_core
      tags:
        - failover_core
    - backups

- name: "VPS エッジ サービス"
  hosts: vps
  become: true
  roles:
    - wireguard
    - role: frr
      tags:
        - frr
    - suricata
    - ddos_notify
    - role: cloudflared
      tags:
        - cloudflared
    - role: portctl
      tags:
        - portctl

- name: "EC2 エッジ サービス"
  hosts: ec2
  become: true
  roles:
    - wireguard
    - role: cloudflared
      tags:
        - cloudflared
    - suricata
